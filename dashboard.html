<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #fff5f7;
      color: #333;
    }

    .container {
      max-width: 750px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      color: #9e3b3b;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .section {
      margin-top: 30px;
      padding: 22px;
      border-radius: 18px;
      background: #fff8f9;
      border: 1px solid #f5dddd;
    }

    .section h2 {
      margin-top: 0;
      color: #9e3b3b;
      font-size: 20px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.6;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .theme-option {
      border: 2px solid #ddd;
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      background: white;
    }

    .theme-option input {
      width: auto;
      margin-right: 8px;
    }

    .theme-preview {
      height: 35px;
      border-radius: 8px;
      margin-top: 8px;
    }

    .pink {
      background: linear-gradient(135deg, #ffb6c1, #ff69b4);
    }

    .purple {
      background: linear-gradient(135deg, #d8b4fe, #9333ea);
    }

    .blue {
      background: linear-gradient(135deg, #93c5fd, #2563eb);
    }

    .gold {
      background: linear-gradient(135deg, #fde68a, #d97706);
    }

    .green {
      background: linear-gradient(135deg, #86efac, #16a34a);
    }

    .font-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .font-option {
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 12px;
      cursor: pointer;
      background: white;
    }

    .font-option input {
      width: auto;
      margin-right: 8px;
    }

    .font-romantic {
      font-family: Georgia, serif;
    }

    .font-modern {
      font-family: Arial, sans-serif;
    }

    .font-elegant {
      font-family: "Trebuchet MS", sans-serif;
    }

    .font-playful {
      font-family: "Comic Sans MS", cursive;
    }

    .photo-info {
      padding: 12px;
      background: #fff0f3;
      border-radius: 10px;
      margin-top: 10px;
      color: #777;
    }

    #photoPreview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .photo-box {
      position: relative;
    }

    .photo-box img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }

    .photo-number {
      position: absolute;
      top: 7px;
      left: 7px;
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
    }

    .photo-count {
      margin-top: 12px;
      font-weight: bold;
      color: #9e3b3b;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    button {
      padding: 13px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    #saveBtn {
      background: #9e3b3b;
      color: white;
      flex: 1;
    }

    #logoutBtn {
      background: #eee;
      color: #333;
    }

    #status {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    #publicLink {
      display: none;
      margin-top: 25px;
      padding: 18px;
      background: #fff0f0;
      border-radius: 12px;
      word-break: break-all;
    }

    #publicLink a {
      color: #9e3b3b;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      .theme-grid,
      .font-grid {
        grid-template-columns: 1fr;
      }

      #photoPreview {
        grid-template-columns: repeat(2, 1fr);
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎂 Birthday Website</h1>

  <p class="subtitle">
    Create your beautiful birthday surprise ❤️
  </p>

  <p id="userEmail"></p>


  <!-- BIRTHDAY DETAILS -->

  <div class="section">

    <h2>🎂 Birthday Details</h2>

    <label for="birthdayName">
      Birthday Name
    </label>

    <input
      id="birthdayName"
      type="text"
      placeholder="Example: Amma"
    >

    <label for="birthdayDate">
      Birthday Date
    </label>

    <input
      id="birthdayDate"
      type="date"
    >

    <label for="secretCode">
      Secret Code
    </label>

    <input
      id="secretCode"
      type="text"
      placeholder="Example: 223010"
    >

    <label for="finalMessage">
      Final Message
    </label>

    <textarea
      id="finalMessage"
      placeholder="Write the final birthday message..."
    ></textarea>

  </div>


  <!-- LETTER -->

  <div class="section">

    <h2>💌 Birthday Letter</h2>

    <p>
      Write the special letter that will appear at the end.
    </p>

    <textarea
      id="letter"
      placeholder="Write your birthday letter here..."
    ></textarea>

  </div>


  <!-- COLOR -->

  <div class="section">

    <h2>🎨 Choose Color Theme</h2>

    <div class="theme-grid">

      <label class="theme-option">
        <input
          type="radio"
          name="theme"
          value="pink"
          checked
        >
        💗 Pink
        <div class="theme-preview pink"></div>
      </label>

      <label class="theme-option">
        <input
          type="radio"
          name="theme"
          value="purple"
        >
        💜 Purple
        <div class="theme-preview purple"></div>
      </label>

      <label class="theme-option">
        <input
          type="radio"
          name="theme"
          value="blue"
        >
        💙 Blue
        <div class="theme-preview blue"></div>
      </label>

      <label class="theme-option">
        <input
          type="radio"
          name="theme"
          value="gold"
        >
        💛 Gold
        <div class="theme-preview gold"></div>
      </label>

      <label class="theme-option">
        <input
          type="radio"
          name="theme"
          value="green"
        >
        💚 Green
        <div class="theme-preview green"></div>
      </label>

    </div>

  </div>


  <!-- FONT -->

  <div class="section">

    <h2>✍️ Choose Font</h2>

    <div class="font-grid">

      <label class="font-option font-romantic">
        <input
          type="radio"
          name="font"
          value="romantic"
          checked
        >
        Romantic
      </label>

      <label class="font-option font-modern">
        <input
          type="radio"
          name="font"
          value="modern"
        >
        Modern
      </label>

      <label class="font-option font-elegant">
        <input
          type="radio"
          name="font"
          value="elegant"
        >
        Elegant
      </label>

      <label class="font-option font-playful">
        <input
          type="radio"
          name="font"
          value="playful"
        >
        Playful
      </label>

    </div>

  </div>


  <!-- PHOTOS -->

  <div class="section">

    <h2>📸 Your Photos</h2>

    <p>
      Upload up to <strong>15 photos</strong>.
    </p>

    <input
      id="photoUpload"
      type="file"
      accept="image/*"
      multiple
    >

    <div class="photo-info">
      📷 Maximum 15 photos
    </div>

    <div
      id="photoCount"
      class="photo-count"
    >
      0 / 15 photos
    </div>

    <div id="photoPreview"></div>

  </div>


  <!-- BUTTONS -->

  <div class="buttons">

    <button id="saveBtn">
      Save Changes ❤️
    </button>

    <button id="logoutBtn">
      Logout
    </button>

  </div>


  <div id="status"></div>


  <!-- PUBLIC LINK -->

  <div id="publicLink">

    🎉 Your birthday website:

    <br><br>

    <a
      id="birthdayUrl"
      href="#"
      target="_blank"
    ></a>

  </div>

</div>


<script>

const birthdayName =
  document.getElementById("birthdayName");

const birthdayDate =
  document.getElementById("birthdayDate");

const secretCode =
  document.getElementById("secretCode");

const finalMessage =
  document.getElementById("finalMessage");

const letter =
  document.getElementById("letter");

const status =
  document.getElementById("status");

const publicLink =
  document.getElementById("publicLink");

const birthdayUrl =
  document.getElementById("birthdayUrl");

const photoUpload =
  document.getElementById("photoUpload");

const photoPreview =
  document.getElementById("photoPreview");

const photoCount =
  document.getElementById("photoCount");


let currentUser = null;

let currentSite = null;

let savedPhotoPaths = [];


/* =========================
   SLUG
========================= */

function createSlug() {

  const random =
    Math.random()
      .toString(36)
      .substring(2, 8);

  return "birthday-" + random;
}


/* =========================
   THEME
========================= */

function getSelectedTheme() {

  const selected =
    document.querySelector(
      'input[name="theme"]:checked'
    );

  return selected
    ? selected.value
    : "pink";
}


function setSelectedTheme(theme) {

  if (!theme) return;

  const radio =
    document.querySelector(
      'input[name="theme"][value="' +
      theme +
      '"]'
    );

  if (radio) {
    radio.checked = true;
  }
}


/* =========================
   FONT
========================= */

function getSelectedFont() {

  const selected =
    document.querySelector(
      'input[name="font"]:checked'
    );

  return selected
    ? selected.value
    : "romantic";
}


function setSelectedFont(font) {

  if (!font) return;

  const radio =
    document.querySelector(
      'input[name="font"][value="' +
      font +
      '"]'
    );

  if (radio) {
    radio.checked = true;
  }
}


/* =========================
   PUBLIC LINK
========================= */

function showPublicLink(slug) {

  const url =
    window.location.origin +
    "/birthday/" +
    slug;

  birthdayUrl.href = url;

  birthdayUrl.textContent = url;

  publicLink.style.display = "block";
}


/* =========================
   PHOTO COUNT
========================= */

function updatePhotoCount(extraCount = 0) {

  const total =
    savedPhotoPaths.length +
    extraCount;

  photoCount.textContent =
    total + " / 15 photos";

}


/* =========================
   CREATE SIGNED URL
========================= */

async function getPhotoUrl(path) {

  const result =
    await supabaseClient
      .storage
      .from("birthday-photos")
      .createSignedUrl(
        path,
        60 * 60
      );

  if (result.error) {

    console.error(
      "Photo URL error:",
      result.error
    );

    return null;
  }

  return result.data.signedUrl;
}


/* =========================
   SHOW SAVED PHOTOS
========================= */

async function showSavedPhotos() {

  photoPreview.innerHTML = "";

  if (
    !savedPhotoPaths ||
    savedPhotoPaths.length === 0
  ) {

    updatePhotoCount(0);

    return;
  }


  for (
    let i = 0;
    i < savedPhotoPaths.length;
    i++
  ) {

    const path =
      savedPhotoPaths[i];

    const url =
      await getPhotoUrl(path);

    if (!url) continue;


    const box =
      document.createElement("div");

    box.className =
      "photo-box";


    const img =
      document.createElement("img");

    img.src = url;

    img.alt =
      "Birthday photo " +
      (i + 1);


    const number =
      document.createElement("div");

    number.className =
      "photo-number";

    number.textContent =
      "#" + (i + 1);


    box.appendChild(img);

    box.appendChild(number);

    photoPreview.appendChild(box);

  }


  updatePhotoCount(0);

}


/* =========================
   SELECT NEW PHOTOS
========================= */

photoUpload.addEventListener(
  "change",
  function () {

    const files =
      Array.from(
        photoUpload.files
      );


    const remaining =
      15 -
      savedPhotoPaths.length;


    if (files.length > remaining) {

      status.textContent =
        "You can upload only " +
        remaining +
        " more photo(s).";

      photoUpload.value = "";

      updatePhotoCount(0);

      return;
    }


    status.textContent =
      files.length +
      " new photo(s) selected.";


    updatePhotoCount(
      files.length
    );

  }
);


/* =========================
   UPLOAD PHOTOS
========================= */

async function uploadPhotos() {

  const files =
    Array.from(
      photoUpload.files
    );


  if (files.length === 0) {

    return [];

  }


  const uploadedPaths = [];


  for (
    let i = 0;
    i < files.length;
    i++
  ) {

    const file =
      files[i];


    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 8) +
      "-" +
      i +
      "." +
      extension;


    const filePath =
      currentUser.id +
      "/" +
      fileName;


    status.textContent =
      "Uploading photo " +
      (i + 1) +
      " of " +
      files.length +
      "...";


    const result =
      await supabaseClient
        .storage
        .from("birthday-photos")
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


    if (result.error) {

      console.error(
        "Upload error:",
        result.error
      );

      throw new Error(
        "Photo " +
        (i + 1) +
        " upload failed: " +
        result.error.message
      );

    }


    uploadedPaths.push(
      filePath
    );

  }


  return uploadedPaths;

}


/* =========================
   LOAD DASHBOARD
========================= */

async function loadDashboard() {

  const {
    data: {
      user
    },
    error
  } =
    await supabaseClient
      .auth
      .getUser();


  if (error || !user) {

    window.location.href =
      "login.html";

    return;
  }


  currentUser =
    user;


  document.getElementById(
    "userEmail"
  ).textContent =
    "Logged in as: " +
    user.email;


  const {
    data,
    error: loadError
  } =
    await supabaseClient
      .from("birthday_sites")
      .select("*")
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if (loadError) {

    status.textContent =
      "Error loading data: " +
      loadError.message;

    return;
  }


  if (!data) {

    updatePhotoCount(0);

    return;
  }


  currentSite =
    data;


  birthdayName.value =
    data.birthday_name || "";


  birthdayDate.value =
    data.birthday_date || "";


  secretCode.value =
    data.secret_code || "";


  finalMessage.value =
    data.final_message || "";


  letter.value =
    data.letter || "";


  if (data.settings) {

    setSelectedTheme(
      data.settings.theme
    );


    setSelectedFont(
      data.settings.font
    );


    if (
      Array.isArray(
        data.settings.photos
      )
    ) {

      savedPhotoPaths =
        data.settings.photos;

    }

  }


  if (data.slug) {

    showPublicLink(
      data.slug
    );

  }


  await showSavedPhotos();

}


/* =========================
   SAVE EVERYTHING
========================= */

document.getElementById(
  "saveBtn"
).addEventListener(
  "click",
  async function () {

    if (!currentUser) {

      return;
    }


    try {

      status.textContent =
        "Saving...";


      /*
        Upload newly selected photos
      */

      const newPhotoPaths =
        await uploadPhotos();


      /*
        Combine old + new photos
      */

      const allPhotoPaths =
        [
          ...savedPhotoPaths,
          ...newPhotoPaths
        ];


      if (allPhotoPaths.length > 15) {

        throw new Error(
          "Maximum 15 photos allowed."
        );

      }


      /*
        Settings
      */

      const settings = {

        theme:
          getSelectedTheme(),

        font:
          getSelectedFont(),

        photos:
          allPhotoPaths

      };


      /*
        Main data
      */

      const siteData = {

        user_id:
          currentUser.id,

        birthday_name:
          birthdayName.value.trim(),

        birthday_date:
          birthdayDate.value ||
          null,

        secret_code:
          secretCode.value.trim(),

        final_message:
          finalMessage.value.trim(),

        letter:
          letter.value.trim(),

        settings:
          settings

      };


      let result;


      /*
        UPDATE EXISTING
      */

      if (currentSite) {

        result =
          await supabaseClient
            .from("birthday_sites")
            .update(
              siteData
            )
            .eq(
              "id",
              currentSite.id
            )
            .select()
            .single();

      }


      /*
        CREATE NEW
      */

      else {

        siteData.slug =
          createSlug();


        result =
          await supabaseClient
            .from("birthday_sites")
            .insert(
              siteData
            )
            .select()
            .single();

      }


      if (result.error) {

        throw new Error(
          result.error.message
        );

      }


      currentSite =
        result.data;


      savedPhotoPaths =
        allPhotoPaths;


      photoUpload.value =
        "";


      status.textContent =
        "Saved successfully! ❤️";


      if (currentSite.slug) {

        showPublicLink(
          currentSite.slug
        );

      }


      await showSavedPhotos();

    }


    catch (error) {

      console.error(error);


      status.textContent =
        "Error: " +
        error.message;

    }

  }
);


/* =========================
   LOGOUT
========================= */

document.getElementById(
  "logoutBtn"
).addEventListener(
  "click",
  async function () {

    await supabaseClient
      .auth
      .signOut();

    window.location.href =
      "login.html";

  }
);


/* =========================
   START
========================= */

loadDashboard();

</script>

</body>
</html>
