<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff5f5;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      color: #9e3b3b;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    #saveBtn {
      background: #9e3b3b;
      color: white;
    }

    #logoutBtn {
      background: #eee;
      color: #333;
      margin-left: 10px;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    #publicLink {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #fff0f0;
      border-radius: 10px;
      word-break: break-all;
    }

    #publicLink a {
      color: #9e3b3b;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🎂 Birthday Website Dashboard</h1>

    <p id="userEmail"></p>

    <label for="birthdayName">Birthday Name</label>
    <input id="birthdayName" type="text" placeholder="Example: Amma">

    <label for="birthdayDate">Birthday Date</label>
    <input id="birthdayDate" type="date">

    <label for="secretCode">Secret Code</label>
    <input id="secretCode" type="text" placeholder="Example: 223010">

    <label for="finalMessage">Final Message</label>
    <textarea id="finalMessage" placeholder="Write the final birthday message..."></textarea>

    <button id="saveBtn">Save Changes ❤️</button>
    <button id="logoutBtn">Logout</button>

    <div id="status"></div>

    <div id="publicLink">
      🎉 Your birthday website:
      <br><br>
      <a id="birthdayUrl" href="#" target="_blank"></a>
    </div>
  </div>

  <script>
    const birthdayName = document.getElementById("birthdayName");
    const birthdayDate = document.getElementById("birthdayDate");
    const secretCode = document.getElementById("secretCode");
    const finalMessage = document.getElementById("finalMessage");
    const status = document.getElementById("status");
    const publicLink = document.getElementById("publicLink");
    const birthdayUrl = document.getElementById("birthdayUrl");

    let currentUser = null;
    let currentSite = null;

    function createSlug() {
      const random = Math.random().toString(36).substring(2, 8);
      return "birthday-" + random;
    }

    async function loadDashboard() {
      const { data: { user }, error } = await supabaseClient.auth.getUser();

      if (error || !user) {
        window.location.href = "login.html";
        return;
      }

      currentUser = user;

      document.getElementById("userEmail").textContent =
        "Logged in as: " + user.email;

      const { data, error: loadError } = await supabaseClient
        .from("birthday_sites")
        .select("*")
        .eq("user_id", user.id)
        .maybeSingle();

      if (loadError) {
        status.textContent = "Error loading data: " + loadError.message;
        return;
      }

      if (data) {
        currentSite = data;

        birthdayName.value = data.birthday_name || "";
        birthdayDate.value = data.birthday_date || "";
        secretCode.value = data.secret_code || "";
        finalMessage.value = data.final_message || "";

        if (data.slug) {
          showPublicLink(data.slug);
        }
      }
    }

    function showPublicLink(slug) {
      const url =
        window.location.origin + "/birthday/" + slug;

      birthdayUrl.href = url;
      birthdayUrl.textContent = url;
      publicLink.style.display = "block";
    }

    document.getElementById("saveBtn").addEventListener("click", async () => {
      if (!currentUser) return;

      status.textContent = "Saving...";

      const siteData = {
        user_id: currentUser.id,
        birthday_name: birthdayName.value.trim(),
        birthday_date: birthdayDate.value || null,
        secret_code: secretCode.value.trim(),
        final_message: finalMessage.value.trim()
      };

      let result;

      if (currentSite) {
        result = await supabaseClient
          .from("birthday_sites")
          .update(siteData)
          .eq("id", currentSite.id)
          .select()
          .single();
      } else {
        siteData.slug = createSlug();

        result = await supabaseClient
          .from("birthday_sites")
          .insert(siteData)
          .select()
          .single();
      }

      if (result.error) {
        status.textContent = "Error: " + result.error.message;
        return;
      }

      currentSite = result.data;

      status.textContent = "Saved successfully! ❤️";

      if (currentSite.slug) {
        showPublicLink(currentSite.slug);
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
    });

    loadDashboard();
  </script>

</body>
</html>
